<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Support Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap');
    
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', Arial, sans-serif;
      background: linear-gradient(150deg, #bfdbfe 0%, #dbeafe 45%, #e0f2fe 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    #bg-stickers {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .sticker {
      position: absolute;
      opacity: 0.05;
      filter: grayscale(100%);
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sticker svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
    }

    .chat-card {
      width: 435px;
      height: 660px;
      background: #fffdf9;
      border-radius: 24px;
      box-shadow: 0 8px 40px rgba(147,197,253,0.38), 0 2px 10px rgba(147,197,253,0.18);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1.5px solid #bae6fd;
      z-index: 1;
      position: relative;
    }

    .chat-header {
      background: linear-gradient(120deg, #f97316 0%, #facc15 55%, #38bdf8 100%);
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      border: 2px solid rgba(255,255,255,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .avatar svg { width: 23px; height: 23px; fill: #1e293b; }

    .header-info { flex: 1; }

    .header-info h1 {
      font-size: 16.5px;
      font-weight: 800;
      color: #000000;
      text-shadow: 0 1px 2px rgba(0,0,0,0.12);
      letter-spacing: 0.1px;
    }

    .header-info p {
      font-size: 11.5px;
      color: #374151;
      margin-top: 2px;
    }

    .online-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(255,255,255,0.38);
      border-radius: 999px;
      padding: 4px 11px;
    }

    .online-badge .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #16a34a;
    }

    .online-badge span {
      font-size: 11px;
      color: #1e293b;
      font-weight: 600;
    }

    .subheader {
      background: #fff8f0;
      border-bottom: 1.5px solid #fed7aa;
      padding: 8px 16px;
      text-align: center;
      font-size: 11.5px;
      font-weight: 500;
      color: #ea580c;
      letter-spacing: 0.15px;
    }

    .chat-box {
      flex: 1;
      background: #f0f9ff;
      padding: 14px 13px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 9px;
      scroll-behavior: smooth;
    }

    .chat-box::-webkit-scrollbar { width: 4px; }
    .chat-box::-webkit-scrollbar-thumb { background: #93c5fd; border-radius: 4px; }
    .chat-box::-webkit-scrollbar-track { background: transparent; }

    .time-label {
      text-align: center;
      font-size: 10.5px;
      color: #7dd3fc;
      letter-spacing: 0.3px;
      margin-bottom: 2px;
    }

    .message {
      padding: 10px 14px;
      border-radius: 16px;
      max-width: 77%;
      font-size: 13.5px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user {
      align-self: flex-end;
      background: linear-gradient(135deg, #fb923c, #facc15);
      color: #7c2d12;
      border-bottom-right-radius: 4px;
      box-shadow: 0 2px 10px rgba(251,146,60,0.22);
    }

    .bot {
      align-self: flex-start;
      background: #fff8f0;
      color: #431407;
      border: 1.5px solid #fed7aa;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 5px rgba(251,186,60,0.1);
    }

    .bot.typing {
      color: #f97316;
      font-style: italic;
      font-size: 13px;
    }

    .input-wrap {
      padding: 11px 13px;
      background: #ffffff;
      border-top: 1.5px solid #fed7aa;
      display: flex;
      align-items: center;
      gap: 9px;
      position: relative;
    }

    .input-tooltip {
      position: absolute;
      top: -38px;
      left: 20px;
      background: linear-gradient(135deg, #f97316, #fb923c);
      color: #ffffff;
      font-size: 11px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      box-shadow: 0 4px 12px rgba(249, 115, 22, 0.25);
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
      z-index: 10;
    }

    .input-tooltip::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 18px;
      width: 8px;
      height: 8px;
      background: #fb923c;
      transform: rotate(45deg);
      border-bottom-right-radius: 2px;
    }

    .input-tooltip.show {
      opacity: 1;
      transform: translateY(0);
    }

    .input-wrap input {
      flex: 1;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1.5px solid #fdba74;
      background: #fff8f0;
      font-family: inherit;
      font-size: 13.5px;
      color: #7c2d12;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }

    .input-wrap input::placeholder { color: #fca87a; }

    .input-wrap input:focus {
      border-color: #f97316;
      background: #fff3e8;
    }

    .send-btn {
      width: 43px;
      height: 43px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #fca5a5 0%, #fb923c 60%, #fef08a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(251, 146, 60, 0.4);
      transition: transform 0.15s, opacity 0.15s, box-shadow 0.15s;
    }

    .send-btn:hover { 
      opacity: 0.9; 
      transform: scale(1.06); 
      box-shadow: 0 6px 18px rgba(251, 146, 60, 0.5);
    }
    
    .send-btn:active { 
      transform: scale(0.96); 
    }

    .send-btn svg { width: 18px; height: 18px; fill: #fff; margin-left: 2px; }

    .footer {
      background: #ffffff;
      text-align: center;
      font-size: 10.5px;
      color: #7dd3fc;
      letter-spacing: 0.2px;
      padding: 6px 0 10px;
    }
  </style>
</head>
<body>

<div id="bg-stickers"></div>

<div class="chat-card">

  <div class="chat-header">
    <div class="avatar">
      <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>
    </div>
    <div class="header-info">
      <h1>Aria &mdash; Support Assistant</h1>
      <p>Friendly help, anytime you need it</p>
    </div>
    <div class="online-badge">
      <div class="dot"></div>
      <span>Online</span>
    </div>
  </div>

  <div class="subheader">
    👋 Ask me anything &mdash; I'm available 24 &times; 7
  </div>

  <div id="chat" class="chat-box">
    <div class="time-label">Today</div>
    <div class="message bot">Hello! I'm Aria, your support assistant. How can I help you today? 😊</div>
  </div>

  <div class="input-wrap">
    <div id="tooltip" class="input-tooltip">Type your question here ✨</div>
    <input id="input" placeholder="Write your message here…" autocomplete="off" />
    <button class="send-btn" onclick="send()" title="Send">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>

  <div class="footer">Secured &amp; Confidential &bull; Aria Support v2.0</div>

</div>

<script>
  const stickerPaths = [
    "M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z",
    "M9,21c0,0.55,0.45,1,1,1h4c0.55,0,1-0.45,1-1v-1H9V21z M12,2C8.14,2,5,5.14,5,9c0,2.38,1.19,4.47,2.96,5.77C8.61,15.54,9,16.41,9,17v1h6v-1c0-0.59,0.39-1.46,1.04-2.23C17.81,13.47,19,11.38,19,9C19,5.14,15.86,2,12,2z",
    "M20,2H4C2.9,2,2,2.9,2,4v18l4-4h14c1.1,0,2-0.9,2-2V4C22,2.9,21.1,2,20,2z M18,14H6v-2h12V14z M18,11H6V9h12V11z M18,8H6V6h12V8z",
    "M12,17.27L18.18,21l-1.64-7.03L22,9.24l-7.19-0.61L12,2L9.19,8.63L2,9.24l5.46,4.73L5.82,21L12,17.27z",
    "M12,21.35l-1.45-1.32C5.4,15.36,2,12.28,2,8.5C2,5.42,4.42,3,7.5,3c1.74,0,3.41,0.81,4.5,2.09C13.09,3.81,14.76,3,16.5,3 C19.58,3,22,5.42,22,8.5c0,3.78-3.4,6.86-8.55,11.54L12,21.35z",
    "M1,21h4V9H1V21z M23,10c0-1.1-0.9-2-2-2h-6.31l0.95-4.57l0.03-0.32c0-0.41-0.17-0.79-0.44-1.06L14.17,1L7.59,7.59 C7.22,7.95,7,8.45,7,9v10c0,1.1,0.9,2,2,2h9c0.83,0,1.54-0.5,1.84-1.22l3.02-7.05C22.95,12.5,23,12.26,23,12V10z",
    "M12,2C6.48,2,2,6.48,2,12s4.48,10,10,10s10-4.48,10-10S17.52,2,12,2z M12,20c-4.41,0-8-3.59-8-8s3.59-8,8-8s8,3.59,8,8 S16.41,20,12,20z M6.5,17.5l3.5-7.5l7.5-3.5l-3.5,7.5L6.5,17.5z M12,10.9c-0.61,0-1.1,0.49-1.1,1.1s0.49,1.1,1.1,1.1s1.1-0.49,1.1-1.1 S12.61,10.9,12,10.9z"
  ];

  document.addEventListener("DOMContentLoaded", () => {
    const container = document.getElementById("bg-stickers");
    const numStickers = 100;
    
    for (let i = 0; i < numStickers; i++) {
      const sticker = document.createElement("div");
      sticker.className = "sticker";
      
      const iconIndex = Math.floor(Math.random() * stickerPaths.length);
      sticker.innerHTML = `<svg viewBox="0 0 24 24"><path d="${stickerPaths[iconIndex]}"/></svg>`;
      
      const size = Math.floor(Math.random() * 16) + 16;
      const top = Math.random() * 100;
      const left = Math.random() * 100;
      const rotation = Math.floor(Math.random() * 360);
      
      sticker.style.width = `${size}px`;
      sticker.style.height = `${size}px`;
      sticker.style.top = `${top}%`;
      sticker.style.left = `${left}%`;
      sticker.style.transform = `rotate(${rotation}deg)`;
      
      container.appendChild(sticker);
    }
  });

  const inputBox = document.getElementById("input");
  const tooltip = document.getElementById("tooltip");
  let hasFocused = false;

  inputBox.addEventListener("focus", () => {
    if (!hasFocused) {
      hasFocused = true;
      tooltip.classList.add("show");
      setTimeout(() => {
        tooltip.classList.remove("show");
      }, 3500);
    }
  });

  inputBox.addEventListener("input", () => {
    tooltip.classList.remove("show");
  });

  function addMessage(text, type) {
    const chat = document.getElementById("chat");
    const msg = document.createElement("div");
    msg.className = "message " + type;
    msg.innerText = text;
    chat.appendChild(msg);
    chat.scrollTop = chat.scrollHeight;
    return msg;
  }

  async function send() {
    const userText = inputBox.value.trim();
    if (!userText) return;
    
    tooltip.classList.remove("show");
    
    addMessage(userText, "user");
    inputBox.value = "";
    
    const typing = addMessage("Aria is typing…", "bot typing");
    
    try {
      const res = await fetch(
        "https://cloud.flowiseai.com/api/v1/prediction/7628b72c-7d41-4d5f-8c7c-e9ead8be7907",
        { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question: userText }) }
      );
      if (!res.ok) throw new Error("API Error");
      const data = await res.json();
      typing.remove();
      addMessage(data.text, "bot");
    } catch (e) {
      typing.remove();
      addMessage("Oops! Couldn't reach the server. Please try again.", "bot");
    }
  }

  inputBox.addEventListener("keypress", e => {
    if (e.key === "Enter") send();
  });
</script>
</body>
</html>
