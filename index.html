<!DOCTYPE html>
<html>
<head>
  <title>Customer Support Bot</title>
  <style>
    body {
      font-family: Arial;
      max-width: 600px;
      margin: 40px auto;
    }
    input {
      width: 75%;
      padding: 10px;
    }
    button {
      padding: 10px;
    }
    #output {
      margin-top: 20px;
      white-space: pre-wrap;
      border: 1px solid #ddd;
      padding: 10px;
    }
  </style>
</head>
<body>

<h2>Customer Support Chatbot</h2>

<input id="input" placeholder="Ask something..." />
<button onclick="send()">Send</button>

<div id="output"></div>

<script>
async function send() {
    const input = document.getElementById("input").value;

    const response = await fetch(
        "https://cloud.flowiseai.com/api/v1/prediction/7628b72c-7d41-4d5f-8c7c-e9ead8be7907",
        {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ question: input })
        }
    );

    const result = await response.json();

    document.getElementById("output").innerText = result.text;
}
</script>

</body>
</html>
