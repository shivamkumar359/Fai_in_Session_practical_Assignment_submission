<!DOCTYPE html>
<html>
<head>
  <title>Support Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', Arial, sans-serif;
      background: linear-gradient(150deg, #bfdbfe 0%, #dbeafe 45%, #e0f2fe 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-card {
      width: 435px;
      height: 660px;
      background: #fffdf9;
      border-radius: 24px;
      box-shadow: 0 8px 40px rgba(147,197,253,0.38), 0 2px 10px rgba(147,197,253,0.18);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1.5px solid #bae6fd;
    }

    /* ── HEADER ── */
    .chat-header {
      background: linear-gradient(120deg, #f97316 0%, #facc15 55%, #38bdf8 100%);
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      border: 2px solid rgba(255,255,255,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .avatar svg { width: 23px; height: 23px; fill: #1e293b; }

    .header-info { flex: 1; }

    .header-info h1 {
      font-size: 16.5px;
      font-weight: 800;
      color: #000000;
      text-shadow: 0 1px 2px rgba(0,0,0,0.12);
      letter-spacing: 0.2px;
      letter-spacing: 0.1px;
    }

    .header-info p {
      font-size: 11.5px;
      color: #374151;
      margin-top: 2px;
    }

    .online-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(255,255,255,0.38);
      border-radius: 999px;
      padding: 4px 11px;
    }

    .online-badge .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #16a34a;
    }

    .online-badge span {
      font-size: 11px;
      color: #1e293b;
      font-weight: 600;
    }

    /* ── SUBHEADER ── */
    .subheader {
      background: #fff8f0;
      border-bottom: 1.5px solid #fed7aa;
      padding: 8px 16px;
      text-align: center;
      font-size: 11.5px;
      font-weight: 500;
      color: #ea580c;
      letter-spacing: 0.15px;
    }

    /* ── CHAT BOX ── */
    .chat-box {
      flex: 1;
      background: #f0f9ff;
      padding: 14px 13px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 9px;
      scroll-behavior: smooth;
    }

    .chat-box::-webkit-scrollbar { width: 4px; }
    .chat-box::-webkit-scrollbar-thumb { background: #93c5fd; border-radius: 4px; }
    .chat-box::-webkit-scrollbar-track { background: transparent; }

    .time-label {
      text-align: center;
      font-size: 10.5px;
      color: #7dd3fc;
      letter-spacing: 0.3px;
      margin-bottom: 2px;
    }

    /* ── BUBBLES ── */
    .message {
      padding: 10px 14px;
      border-radius: 16px;
      max-width: 77%;
      font-size: 13.5px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user {
      align-self: flex-end;
      background: linear-gradient(135deg, #fb923c, #facc15);
      color: #7c2d12;
      border-bottom-right-radius: 4px;
      box-shadow: 0 2px 10px rgba(251,146,60,0.22);
    }

    .bot {
      align-self: flex-start;
      background: #fff8f0;
      color: #431407;
      border: 1.5px solid #fed7aa;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 5px rgba(251,186,60,0.1);
    }

    .bot.typing {
      color: #f97316;
      font-style: italic;
      font-size: 13px;
    }

    /* ── INPUT AREA ── */
    .input-wrap {
      padding: 11px 13px;
      background: #ffffff;
      border-top: 1.5px solid #fed7aa;
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .input-wrap input {
      flex: 1;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1.5px solid #fdba74;
      background: #fff8f0;
      font-family: inherit;
      font-size: 13.5px;
      color: #7c2d12;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }

    .input-wrap input::placeholder { color: #fca87a; }

    .input-wrap input:focus {
      border-color: #f97316;
      background: #fff3e8;
    }

    .send-btn {
      width: 43px;
      height: 43px;
      border-radius: 50%;
      border: none;
      background: #1d4ed8;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 3px 12px rgba(29,78,216,0.35);
      transition: transform 0.15s, opacity 0.15s;
    }

    .send-btn:hover { opacity: 0.88; transform: scale(1.06); }
    .send-btn:active { transform: scale(0.96); }

    .send-btn svg { width: 18px; height: 18px; fill: #fff; margin-left: 2px; }

    /* ── FOOTER ── */
    .footer {
      background: #ffffff;
      text-align: center;
      font-size: 10.5px;
      color: #7dd3fc;
      letter-spacing: 0.2px;
      padding: 6px 0 10px;
    }
  </style>
</head>
<body>

<div class="chat-card">

  <div class="chat-header">
    <div class="avatar">
      <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>
    </div>
    <div class="header-info">
      <h1>Aria &mdash; Support Assistant</h1>
      <p>Friendly help, anytime you need it</p>
    </div>
    <div class="online-badge">
      <div class="dot"></div>
      <span>Online</span>
    </div>
  </div>

  <div class="subheader">
    👋 Ask me anything &mdash; I'm available 24 &times; 7
  </div>

  <div id="chat" class="chat-box">
    <div class="time-label">Today</div>
    <div class="message bot">Hello! I'm Aria, your support assistant. How can I help you today? 😊</div>
  </div>

  <div class="input-wrap">
    <input id="input" placeholder="Write your message here…" autocomplete="off" />
    <button class="send-btn" onclick="send()" title="Send">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>

  <div class="footer">Secured &amp; Confidential &bull; Aria Support v2.0</div>

</div>

<script>
  function addMessage(text, type) {
    const chat = document.getElementById("chat");
    const msg = document.createElement("div");
    msg.className = "message " + type;
    msg.innerText = text;
    chat.appendChild(msg);
    chat.scrollTop = chat.scrollHeight;
    return msg;
  }

  async function send() {
    const inputBox = document.getElementById("input");
    const userText = inputBox.value.trim();
    if (!userText) return;
    addMessage(userText, "user");
    inputBox.value = "";
    const typing = addMessage("Aria is typing…", "bot typing");
    try {
      const res = await fetch(
        "https://cloud.flowiseai.com/api/v1/prediction/7628b72c-7d41-4d5f-8c7c-e9ead8be7907",
        { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question: userText }) }
      );
      const data = await res.json();
      typing.remove();
      addMessage(data.text, "bot");
    } catch (e) {
      typing.remove();
      addMessage("Oops! Couldn't reach the server. Please try again.", "bot");
    }
  }

  document.getElementById("input").addEventListener("keypress", e => {
    if (e.key === "Enter") send();
  });
</script>
</body>
</html>
